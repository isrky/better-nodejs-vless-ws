# fly.toml app configuration file generated for isrky-edge on 2026-08-14T06:26:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'isrky-edge'
primary_region = 'ams'

# Secrets are set with `fly secrets set`. Either the per-secret values
# (UUID, WSPATH, ADMIN_TOKEN, PROVISION_SECRET, USERS) or — preferred, see
# CREDENTIALS.md § Encrypted secrets — just the two group keys the server
# decrypts the bundled src/node/secrets.enc.json with:
#   fly secrets set SECRETS_KEY_COMMON=… SECRETS_KEY_SERVER=…   (npm run creds:keys)

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVER_PORT = '3000'
  # Hostname written into the client configs handed out by /admin-stats/provision.
  # Not a secret, so it lives here rather than in `fly secrets` — it is reviewable
  # in git, and getting it wrong is silent: without it the server falls back to
  # the Host header of whichever request minted the invite, so opening the panel
  # via isrky-edge.fly.dev would produce configs pointing at that name instead.
  PUBLIC_HOST = 'edge.isrky.dev'

  # Resolve destination hostnames here instead of through Fly's resolvers, so
  # the query stream is not visible to Fly's network or anything upstream of it.
  # Also not a secret. If it is unreachable the server logs and falls back to
  # the system resolver, so an outage here degrades rather than breaks — see the
  # breaker in src/node/doh.js.
  #
  # The /flyio suffix is an AdGuard Home client id, so this machine's queries
  # are attributed separately in its statistics rather than merged with every
  # other device. It is part of the path, so changing it changes the endpoint —
  # a typo here does not error, it just silently falls back to the system
  # resolver and the queries stop appearing under that client.
  DOH_URL = 'https://dns.isrky.dev/dns-query/flyio'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
