# Fly.io config for the UDP-capable Node build (appws.js).
# Rename `app` to taste before `fly launch` / `fly deploy`.
#
# Set secrets before deploying (do NOT put them here — this file is committed):
#   fly secrets set UUID=<your-uuid> WSPATH=/<your-wspath>
#
# Bind a hostname MEB already lets through (a subdomain of an allowed domain):
#   fly certs add edge.isrky.dev   # then add the DNS records Fly prints

app = "isrky-edge"
primary_region = "fra"  # Frankfurt: lowest-latency Fly region for Turkey

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_PORT = "3000"

# Fly's edge terminates TLS and forwards plaintext HTTP/WS to the container on
# internal_port. appws.js auto-detects plaintext, so no code change is needed.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # keep it warm so live tunnels aren't dropped
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/"                 # returns 200 (decoy page)
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
