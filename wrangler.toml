# The name is visible to anyone who sees the URL, so keep it uninteresting.
name = "static-cache"
main = "src/worker/index.mjs"
compatibility_date = "2025-06-01"

# Do not publish the free <name>.<subdomain>.workers.dev hostname. A public
# workers.dev URL is how proxy Workers get discovered and flagged; reach this
# Worker only through the custom domain below.
workers_dev = false

# Bind the Worker to a custom domain on the isrky.dev zone. custom_domain = true
# makes Cloudflare provision the DNS record and TLS cert and route 100% of the
# hostname's traffic to this Worker, so no manual dashboard step is needed.
routes = [
  { pattern = "assets.isrky.dev", custom_domain = true }
]

# No compatibility_flags on purpose: the Worker is Buffer-free, so skipping
# nodejs_compat keeps the bundle small and cold starts fast.

# WSPATH is deliberately not set here. Anything under [vars] is committed, so
# a path checked into a public repository provides no obscurity at all. Set it
# as a secret alongside UUID instead:
#   npx wrangler secret put WSPATH
# Unset, it defaults to "/", which matches every WebSocket upgrade. That is
# safe — UUID is the actual credential — but a random path means probes never
# reach the VLESS handler and only ever see the cover page.

# PROXYIP is close to mandatory in practice — Workers cannot open a TCP
# connection back into Cloudflare's own edge, so destinations behind Cloudflare
# fail without a relay host to retry through. Accepts "host" or "host:port"
# (bare and bracketed IPv6 both work).
#
# Set it as a secret rather than uncommenting it here:
#   npx wrangler secret put PROXYIP        e.g. 203.0.113.5:8443
# The code reads env.PROXYIP either way, and keeping it out of the committed
# config avoids advertising that your relay host runs an open forwarder.

# DOH_URL = "https://cloudflare-dns.com/dns-query"

# UUID is the only authentication credential, so it lives in a secret rather
# than here, and there is no built-in default:
#   npx wrangler secret put UUID
# Until it is set, the Worker serves the decoy page to every request and
# proxies nothing. For local runs, put UUID in .dev.vars (gitignored).
#
# ALTERNATIVE (see CREDENTIALS.md § Encrypted secrets): instead of UUID/WSPATH/
# PROXYIP secrets, set the two group keys and let the Worker decrypt the bundled
# src/node/secrets.enc.json on first request:
#   npx wrangler secret put SECRETS_KEY_COMMON
#   npx wrangler secret put SECRETS_KEY_EDGE      (npm run creds:keys reveals them)

[observability]
enabled = true
